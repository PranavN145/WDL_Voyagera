<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="../css/vibes.css">
</head>
<body>

  <!-- Change data-vibe attribute matching keys inside vibesData.js to populate context dynamically -->
  <main id="vibe-context-wrapper" data-vibe="cities">
    
    <header class="vibe-hero">
      <div class="hero-content">
        <a href="../index.html" class="btn-back">← Back to Hub</a>
        <div><span class="hero-badge">BACKPACKER PATH</span></div>

        <p id="vibe-desc">
          Urban chaos, street food, nightlife, architecture, and budget hostels for explorers.
        </p>
      </div>
    </header>

    <section class="vibe-container">
      <div class="destinations-grid" id="destinations-container">
        <!-- Rendered Programmatically via engine script injection below -->
      </div>
    </section>

  </main>

  <!-- Load internal dataset architecture first followed by layout rendering compilation layer -->
  <script src="../javascript/vibesData.js"></script>
  <script src="../javascript/vibesEngine.js"></script>
